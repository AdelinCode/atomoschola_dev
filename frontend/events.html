<!DOCTYPE html>
<html lang="en">
<head>
    <script>!function(){var t=localStorage.getItem('atomo-schola-theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');if(t==='dark')document.documentElement.classList.add('dark-mode');}();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - Atomo Schola</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/dropdown.css">
    <link rel="stylesheet" href="styles/search.css">
    <link rel="stylesheet" href="styles/notifications.css">
    <link rel="stylesheet" href="styles/site-header.css">
    <link rel="stylesheet" href="styles/events.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="events-page">
    <script src="scripts/site-header.js"></script>

    <main class="events-shell">
        <div id="eventsDirectory">
            <header class="events-hero">
                <div>
                    <h1>Events</h1>
                    <p>Explore workshops, competitions, and community events from Atomo Schola.</p>
                    <button type="button" class="events-button events-primary" id="createEvent" hidden>
                        <i class="fas fa-plus" aria-hidden="true"></i> New event
                    </button>
                </div>
                <div class="events-calendar-art" aria-hidden="true">
                    <i class="far fa-calendar-alt"></i>
                </div>
            </header>

            <section class="events-agenda" aria-labelledby="eventsAgendaTitle">
                <div class="events-agenda-head">
                    <h2 id="eventsAgendaTitle">Event calendar</h2>
                    <div class="events-filters">
                        <label>When
                            <select id="eventPeriod">
                                <option value="all">All dates</option>
                                <option value="upcoming">Upcoming</option>
                                <option value="ongoing">In progress</option>
                                <option value="past">Past</option>
                            </select>
                        </label>
                        <label>Category
                            <select id="eventCategory">
                                <option value="all">All categories</option>
                            </select>
                        </label>
                    </div>
                </div>
                <p class="events-state" id="eventsListStatus" role="status">Loading events…</p>
                <ol class="events-list" id="eventsList"></ol>
            </section>
        </div>

        <div id="eventDetails" hidden>
            <div class="events-detail-nav">
                <a href="events.html"><i class="fas fa-arrow-left" aria-hidden="true"></i> All events</a>
                <button type="button" class="events-button" id="editEvent" hidden>Edit event</button>
            </div>
            <p class="events-state" id="eventDetailStatus" role="status">Loading event…</p>
            <article class="events-article" id="eventArticle" hidden>
                <header class="events-article-head">
                    <div class="events-labels">
                        <span class="events-category" id="eventArticleType"></span>
                        <span id="eventArticleStatus"></span>
                    </div>
                    <h1 id="eventArticleTitle"></h1>
                    <p id="eventArticleSummary"></p>
                </header>
                <img id="eventArticleCover" class="events-article-cover" alt="" hidden>
                <div class="events-article-layout">
                    <div id="eventArticleBody" class="events-article-body"></div>
                    <aside class="events-facts" aria-labelledby="eventFactsTitle">
                        <h2 id="eventFactsTitle">Event details</h2>
                        <dl id="eventFacts"></dl>
                        <a class="events-button events-primary" id="eventRegistration" target="_blank" rel="noopener noreferrer" hidden>Register <i class="fas fa-arrow-up-right-from-square" aria-hidden="true"></i></a>
                    </aside>
                </div>
            </article>
        </div>
    </main>

    <template id="eventCard">
        <li>
            <a class="events-entry">
                <time class="events-date-tile"><strong></strong><span></span></time>
                <div class="events-entry-copy">
                    <div class="events-labels"><span class="events-category"></span><span class="events-entry-status"></span></div>
                    <h3></h3>
                    <p class="events-entry-summary"></p>
                    <p class="events-entry-meta"></p>
                </div>
                <i class="fas fa-arrow-right events-entry-arrow" aria-hidden="true"></i>
            </a>
        </li>
    </template>

    <dialog id="eventEditor" class="events-editor" aria-labelledby="eventEditorTitle">
        <div class="events-editor-head">
            <h2 id="eventEditorTitle">New event</h2>
            <button type="button" class="events-button" id="closeEventEditor" aria-label="Close event editor">&times;</button>
        </div>
        <form id="eventForm" class="events-form">
            <label class="events-wide">Title<input name="title" maxlength="120" required></label>
            <label>Category<select name="type" required></select></label>
            <label>Format<select name="format" required><option value="online">Online</option><option value="in-person">In person</option><option value="hybrid">Hybrid</option></select></label>
            <label>Starts at<input name="startsAt" type="datetime-local" aria-describedby="eventTimeZone" required></label>
            <label>Ends at<input name="endsAt" type="datetime-local" aria-describedby="eventTimeZone" required></label>
            <p class="events-wide events-form-note" id="eventTimeZone"></p>
            <label>Organizer<input name="organizer" maxlength="120" required></label>
            <label>Location<input name="location" maxlength="200"></label>
            <label>Capacity (optional)<input name="capacity" type="number" min="1" max="100000"></label>
            <label>Registration link (optional)<input name="registrationUrl" type="url" maxlength="2048"></label>
            <label class="events-wide">Cover image URL (optional)<input name="coverUrl" type="url" maxlength="2048"></label>
            <label class="events-wide">Summary<textarea name="summary" rows="2" maxlength="280" required></textarea></label>
            <label class="events-wide">Article
                <textarea name="article" rows="8" maxlength="20000" aria-describedby="eventArticleHelp" required></textarea>
                <small id="eventArticleHelp">Separate paragraphs with a blank line. Start a line with ## followed by a space to add a heading.</small>
            </label>
            <p class="events-wide events-form-error" id="eventFormError" role="alert" hidden></p>
            <div class="events-wide events-form-actions">
                <button type="submit" class="events-button events-primary" id="saveEvent">Publish event</button>
            </div>
        </form>
    </dialog>

    <script src="scripts/config.js"></script>
    <script src="scripts/api.js"></script>
    <script src="scripts/search.js"></script>
    <script src="scripts/notifications.js"></script>
    <script src="scripts/theme.js"></script>
    <script src="scripts/main.js"></script>
    <script src="scripts/events.js"></script>
    <div id="site-footer"></div>
    <script src="scripts/footer.js"></script>
</body>
</html>
