<!DOCTYPE html>
<html lang="en">
<head>
    <script>!function(){var t=localStorage.getItem('atomo-schola-theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');if(t==='dark')document.documentElement.classList.add('dark-mode');}();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contributors - Atomo Schola</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/dropdown.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/search.css">
    <link rel="stylesheet" href="styles/notifications.css">
    <link rel="stylesheet" href="styles/site-header.css">
</head>
<body class="contributors-page">
    <!-- Header -->
    <script src="scripts/site-header.js"></script>

    <!-- Staff Content -->
    <main class="staff-container">
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i>
            Back to Home
        </a>
        
        <header class="contributors-header">
            <div>
                <h1>Platform Contributors</h1>
                <p>Meet the people who create, edit, and maintain Atomo Schola’s lessons.</p>
            </div>
            <button type="button" class="contributors-button" onclick="showLeaderboardModal()">
                <i class="fas fa-trophy" aria-hidden="true"></i> Leaderboard
            </button>
        </header>

        <div class="contributors-groups">
            <!-- Editor Section -->
            <section class="contributors-group accent-editor">
                <div class="contributors-group-heading">
                    <div class="contributors-role-icon" aria-hidden="true">
                        <i class="fas fa-pen-fancy"></i>
                    </div>
                    <h2>Editors</h2>
                    <span class="contributors-count" id="editorCount">0</span>
                </div>
                <div class="contributors-list" id="editorGrid">
                    <p class="contributors-state">Loading...</p>
                </div>
            </section>

            <!-- Creator Section -->
            <section class="contributors-group accent-creator">
                <div class="contributors-group-heading">
                    <div class="contributors-role-icon" aria-hidden="true">
                        <i class="fas fa-edit"></i>
                    </div>
                    <h2>Creators</h2>
                    <span class="contributors-count" id="creatorCount">0</span>
                </div>
                <div class="contributors-list" id="creatorGrid">
                    <p class="contributors-state">Loading...</p>
                </div>
            </section>

            <!-- Staff Section -->
            <section class="contributors-group accent-staff" id="staffSection" hidden>
                <div class="contributors-group-heading">
                    <div class="contributors-role-icon" aria-hidden="true">
                        <i class="fas fa-user-shield"></i>
                    </div>
                    <h2>Staff</h2>
                    <span class="contributors-count" id="staffCount">0</span>
                </div>
                <div class="contributors-list" id="staffGrid"></div>
            </section>

            <!-- Creator Commission Section -->
            <section class="contributors-group accent-commission" id="creatorCommissionSection" hidden>
                <div class="contributors-group-heading">
                    <div class="contributors-role-icon" aria-hidden="true">
                        <i class="fas fa-gavel"></i>
                    </div>
                    <h2>Creator Commission</h2>
                    <span class="contributors-count" id="creatorCommissionCount">0</span>
                </div>
                <div class="contributors-list" id="creatorCommissionGrid"></div>
            </section>

            <!-- Editor Commission Section -->
            <section class="contributors-group accent-commission" id="editorCommissionSection" hidden>
                <div class="contributors-group-heading">
                    <div class="contributors-role-icon" aria-hidden="true">
                        <i class="fas fa-balance-scale"></i>
                    </div>
                    <h2>Editor Commission</h2>
                    <span class="contributors-count" id="editorCommissionCount">0</span>
                </div>
                <div class="contributors-list" id="editorCommissionGrid"></div>
            </section>
        </div>
    </main>

    <script src="scripts/config.js"></script>
    <script src="scripts/api.js"></script>
    <script src="scripts/search.js"></script>
    <script src="scripts/notifications.js"></script>
    <script src="scripts/theme.js"></script>
    <script src="scripts/main.js"></script>
    <script>
        function renderContributors(role, users, emptyMessage = 'No contributors yet.') {
            const grid = document.getElementById(role + 'Grid');
            document.getElementById(role + 'Count').textContent = users.length;
            grid.replaceChildren();

            if (!users.length) {
                const message = document.createElement('p');
                message.className = 'contributors-state';
                message.textContent = emptyMessage;
                grid.append(message);
                return;
            }

            const group = document.getElementById(role + 'Section');
            if (group) group.hidden = false;

            for (const user of users) {
                const name = [user.firstName, user.lastName].filter(Boolean).join(' ') || user.username || 'Contributor';
                const link = document.createElement('a');
                link.className = 'contributors-person';
                link.href = 'public-profile.html?id=' + encodeURIComponent(user._id);
                link.innerHTML = '<span class="contributors-avatar" aria-hidden="true"></span><span class="contributors-name"></span><i class="fas fa-chevron-right" aria-hidden="true"></i>';
                link.querySelector('.contributors-avatar').textContent = (user.username || name).slice(0, 2).toUpperCase();
                link.querySelector('.contributors-name').textContent = name;
                grid.append(link);
            }
        }

        async function fetchContributors(path) {
            const response = await fetch(window.CONFIG.API_BASE_URL + path);
            const result = await response.json();
            if (!response.ok || !result.success) throw new Error('Could not load contributors.');
            return result.data;
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchContributors('/users/staff').then(users => {
                for (const role of ['editor', 'creator', 'staff']) {
                    renderContributors(role, users.filter(user => user.userType === role));
                }
            }).catch(() => {
                for (const role of ['editor', 'creator']) renderContributors(role, [], 'Could not load contributors.');
            });

            fetchContributors('/commission/members').then(users => {
                for (const role of ['creator', 'editor']) {
                    renderContributors(role + 'Commission', users.filter(user => user.commissionType === role));
                }
            }).catch(error => console.error('Error loading commission members:', error));
        });
    </script>
    <!-- Footer -->
    <div id="site-footer"></div>
    <script src="scripts/footer.js"></script>
</body>
</html>
