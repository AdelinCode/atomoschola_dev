<!DOCTYPE html>
<html lang="en">
<head>
    <script>!function(){var t=localStorage.getItem('atomo-schola-theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');if(t==='dark')document.documentElement.classList.add('dark-mode');}();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEM - Atomo Schola</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/dropdown.css">
    <link rel="stylesheet" href="styles/search.css">
    <link rel="stylesheet" href="styles/notifications.css">
    <link rel="stylesheet" href="styles/category-themes.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head>
<body class="theme-steam">
    <!-- Page Background -->
    <div style="position: fixed; inset: 0; z-index: -1; background-image: url('photo_background/stem.jpeg'); background-size: cover; background-position: center; opacity: 0.15;"></div>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
                <div class="logo">
                    <a href="index.html">
                        <img src="logo.jpeg" alt="Atomo Schola" style="height: 50px; vertical-align: middle;">
                        <span>Atomo Schola</span>
                    </a>
                </div>

                <div class="search-bar">
                    <input type="text" placeholder="Search for lessons, topics..." id="searchInput">
                    <button class="search-btn">
                        <i class="fas fa-search"></i>
                    </button>
                </div>

                <nav class="nav-menu" id="navMenu">
                    <!-- Dynamic navigation will be inserted here -->
                </nav>
            <button class="nav-hamburger" id="navHamburger" aria-label="Open menu"><span></span><span></span><span></span></button>
                    </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <section class="hero">
                <h1><i class="fas fa-atom"></i> STEM</h1>
                <p>Science, Technology, Engineering & Mathematics</p>
                <div class="hero-stats">
                    <div class="stat">
                        <span class="stat-number" id="totalLessons">0</span>
                        <span class="stat-label">Lessons</span>
                    </div>
                    <div class="stat">
                        <span class="stat-number" id="totalSubjects">0</span>
                        <span class="stat-label">Subjects</span>
                    </div>
                    <div class="stat">
                        <span class="stat-number" id="totalDomains">0</span>
                        <span class="stat-label">Domains</span>
                    </div>
                </div>
            </section>
            </section>

            <section class="featured-subjects">
                <h2>STEM Subjects</h2>
                <div class="subjects-grid" id="subjectsGrid">
                    <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #666;">
                        Loading subjects...
                    </div>
                </div>
            </section>
        </div>
    </main>
    <!-- Footer -->
    <div id="site-footer"></div>

    <script src="scripts/config.js"></script>
    <script src="scripts/api.js"></script>
    <script src="scripts/search.js"></script>
    <script src="scripts/notifications.js"></script>
    <script src="scripts/theme.js"></script>
    <script src="scripts/main.js"></script>
    <script src="scripts/category-page.js"></script>    <script src="scripts/footer.js"></script>
</body>
</html>
