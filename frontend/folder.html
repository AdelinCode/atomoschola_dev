<!DOCTYPE html>
<html lang="en">
<head>
    <script>!function(){var t=localStorage.getItem('atomo-schola-theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');if(t==='dark')document.documentElement.classList.add('dark-mode');}();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folder - Atomo Schola</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/dropdown.css">
    <link rel="stylesheet" href="styles/notifications.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .folder-page { max-width: 820px; margin: 0 auto; padding: 40px 20px 80px; }
        .folder-header { background: var(--bg-secondary); border: 1px solid var(--border-primary); border-radius: 14px; padding: 32px; margin-bottom: 28px; }
        .folder-icon { width: 56px; height: 56px; background: linear-gradient(135deg,#6C3483,#9b59b6); border-radius: 14px; display:flex; align-items:center; justify-content:center; margin-bottom: 16px; }
        .folder-icon i { font-size: 26px; color: white; }
        .folder-title { font-size: 28px; font-weight: 800; color: var(--text-primary); margin-bottom: 8px; }
        .folder-desc { color: var(--text-secondary); font-size: 15px; line-height: 1.7; margin-bottom: 16px; }
        .folder-meta { display: flex; gap: 20px; flex-wrap: wrap; font-size: 13px; color: var(--text-muted); }
        .folder-meta span { display: flex; align-items: center; gap: 6px; }
        .folder-meta a { color: var(--accent-primary); text-decoration: none; }
        .folder-meta a:hover { text-decoration: underline; }

        .lesson-list { display: flex; flex-direction: column; gap: 10px; }
        .lesson-item { display: flex; align-items: center; gap: 16px; padding: 16px 20px; background: var(--bg-secondary); border: 1px solid var(--border-primary); border-radius: 10px; cursor: pointer; text-decoration: none; transition: border-color 0.2s, transform 0.15s; }
        .lesson-item:hover { border-color: var(--accent-primary); transform: translateX(3px); }
        .lesson-num { width: 30px; height: 30px; border-radius: 50%; background: var(--bg-tertiary); border: 2px solid var(--border-primary); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--text-secondary); flex-shrink: 0; }
        .lesson-item:hover .lesson-num { background: var(--accent-primary); border-color: var(--accent-primary); color: white; }
        .lesson-info { flex: 1; min-width: 0; }
        .lesson-name { font-size: 15px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .lesson-tags { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
        .tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; }
        .tag-type { background: #e0f2fe; color: #0369a1; }
        .tag-lang { background: #f0fdf4; color: #166534; }
        .tag-level { background: #fef9c3; color: #854d0e; }
        .lesson-arrow { color: var(--text-muted); font-size: 14px; flex-shrink: 0; }

        .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty i { font-size: 48px; margin-bottom: 16px; display: block; opacity: 0.4; }

        .dark-mode .tag-type { background: #0c2a3d; color: #7dd3fc; }
        .dark-mode .tag-lang  { background: #052e16; color: #86efac; }
        .dark-mode .tag-level { background: #2d1a00; color: #fcd34d; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <a href="index.html"><img src="logo.jpeg" alt="Atomo Schola"><span>Atomo Schola</span></a>
            </div>
            <nav class="nav-menu" id="navMenu"></nav>
            <button class="nav-hamburger" id="navHamburger" aria-label="Open menu"><span></span><span></span><span></span></button>
        </div>
    </header>

    <main class="main-content">
        <div class="folder-page">
            <div id="folderContent">
                <div class="empty"><i class="fas fa-spinner fa-spin"></i><p>Loading...</p></div>
            </div>
        </div>
    </main>

    <script src="scripts/config.js"></script>
    <script src="scripts/api.js"></script>
    <script src="scripts/notifications.js"></script>
    <script src="scripts/theme.js"></script>
    <script src="scripts/main.js"></script>
    <script>
        const API_BASE = window.CONFIG?.API_BASE_URL || 'http://localhost:5000/api';

        document.addEventListener('DOMContentLoaded', async () => {
            const id = new URLSearchParams(window.location.search).get('id');
            if (!id) { renderError('No folder specified.'); return; }
            try {
                const res = await fetch(`${API_BASE}/folders/${id}`);
                const data = await res.json();
                if (!data.success) throw new Error(data.message);
                renderFolder(data.data);
            } catch (e) {
                renderError(e.message);
            }
        });

        function renderFolder(folder) {
            const creator = folder.creator;
            const creatorName = creator?.firstName
                ? `${creator.firstName} ${creator.lastName}`
                : creator?.username || 'Unknown';
            const lessons = folder.lessons || [];

            document.title = `${folder.title} — Atomo Schola`;

            document.getElementById('folderContent').innerHTML = `
                <div class="folder-header">
                    <div class="folder-icon"><i class="fas fa-layer-group"></i></div>
                    <div class="folder-title">${folder.title}</div>
                    ${folder.description ? `<div class="folder-desc">${folder.description}</div>` : ''}
                    <div class="folder-meta">
                        <span><i class="fas fa-user"></i>
                            <a href="public-profile.html?id=${creator?._id}">${creatorName}</a>
                        </span>
                        <span><i class="fas fa-book"></i> ${lessons.length} lesson${lessons.length !== 1 ? 's' : ''}</span>
                        <span><i class="fas fa-calendar"></i> ${new Date(folder.createdAt).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' })}</span>
                    </div>
                </div>

                <div class="lesson-list" id="lessonList">
                    ${lessons.length === 0
                        ? `<div class="empty"><i class="fas fa-inbox"></i><p>No lessons in this folder yet.</p></div>`
                        : lessons.map((l, i) => `
                            <a class="lesson-item" href="lesson.html?id=${l._id}">
                                <div class="lesson-num">${i + 1}</div>
                                <div class="lesson-info">
                                    <div class="lesson-name">${l.title}</div>
                                    <div class="lesson-tags">
                                        <span class="tag tag-type">${l.type || 'text'}</span>
                                        ${l.language ? `<span class="tag tag-lang">${l.language.charAt(0).toUpperCase() + l.language.slice(1)}</span>` : ''}
                                        ${l.level ? `<span class="tag tag-level">${l.level}</span>` : ''}
                                    </div>
                                </div>
                                <i class="fas fa-chevron-right lesson-arrow"></i>
                            </a>`
                        ).join('')
                    }
                </div>
            `;
        }

        function renderError(msg) {
            document.getElementById('folderContent').innerHTML =
                `<div class="empty"><i class="fas fa-exclamation-circle"></i><p>${msg}</p></div>`;
        }
    </script>
    <div id="site-footer"></div>
    <script src="scripts/footer.js"></script>
</body>
</html>
